name: weekly-intel-run

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch: {}      # manual trigger from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run weekly crew
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          TWITCH_CLIENT_ID:     ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          RAWG_API_KEY:         ${{ secrets.RAWG_API_KEY }}
          STEAM_API_KEY:        ${{ secrets.STEAM_API_KEY }}
          LANGSMITH_API_KEY:    ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT:    ${{ secrets.LANGSMITH_PROJECT }}
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_UPLOAD_PLAYLISTS: ${{ secrets.YOUTUBE_UPLOAD_PLAYLISTS }}
          GAME_YOUTUBE_PLAYLISTS: ${{ secrets.GAME_YOUTUBE_PLAYLISTS }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          BRIEFING_EMAIL_TO:    ${{ secrets.BRIEFING_EMAIL_TO }}
          BRIEFING_EMAIL_FROM:  ${{ secrets.BRIEFING_EMAIL_FROM }}
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:      ${{ secrets.ALPACA_BASE_URL }}
        run: python run_weekly.py
