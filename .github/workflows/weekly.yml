name: weekly-intel-run

# Four sequential jobs instead of one: GitHub-hosted runners hard-cap every
# job at 6 hours (timeout-minutes can only lower that), and a full-watchlist
# run no longer fits in a single job -- run 29438324984 timed out at the cap.
# Each phase gets its own 6-hour budget; cross-phase state flows entirely
# through Supabase, so the jobs share nothing but ordering.
#
# Downstream jobs use `!cancelled()` (not success()) so a failed phase does
# not block later ones -- synthesis is designed to work with whatever data
# exists. A skipped upstream job also satisfies it, which is what makes the
# single-phase manual dispatch below work.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase(s) to run"
        type: choice
        default: all
        options:
          - all
          - collect
          - news
          - sentiment
          - synthesize

permissions:
  contents: read

concurrency:
  group: weekly-intel-run
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
  SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
  TWITCH_CLIENT_ID:     ${{ secrets.TWITCH_CLIENT_ID }}
  TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
  RAWG_API_KEY:         ${{ secrets.RAWG_API_KEY }}
  STEAM_API_KEY:        ${{ secrets.STEAM_API_KEY }}
  REDDIT_PROXY_URL:          ${{ secrets.REDDIT_PROXY_URL }}
  REDDIT_PROXY_INSECURE_SSL: ${{ secrets.REDDIT_PROXY_INSECURE_SSL }}
  LANGSMITH_API_KEY:    ${{ secrets.LANGSMITH_API_KEY }}
  LANGSMITH_PROJECT:    ${{ secrets.LANGSMITH_PROJECT }}
  YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_UPLOAD_PLAYLISTS: ${{ secrets.YOUTUBE_UPLOAD_PLAYLISTS }}
  GAME_YOUTUBE_PLAYLISTS: ${{ secrets.GAME_YOUTUBE_PLAYLISTS }}
  RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
  BRIEFING_EMAIL_TO:    ${{ secrets.BRIEFING_EMAIL_TO }}
  BRIEFING_EMAIL_FROM:  ${{ secrets.BRIEFING_EMAIL_FROM }}
  ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
  ALPACA_BASE_URL:      ${{ secrets.ALPACA_BASE_URL }}

jobs:
  collect:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'collect' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect (market, financial, studio intel, patch notes)
        run: python run_weekly.py --phase collect

  news:
    runs-on: ubuntu-latest
    needs: collect
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'news') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: News article ingestion
        run: python run_weekly.py --phase news

  sentiment:
    runs-on: ubuntu-latest
    needs: news
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'sentiment') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sentiment analysis
        run: python run_weekly.py --phase sentiment

  synthesize:
    runs-on: ubuntu-latest
    needs: sentiment
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'synthesize') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Synthesize (discovery, briefing, portfolio, returns)
        run: python run_weekly.py --phase synthesize
